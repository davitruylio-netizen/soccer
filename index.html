<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>NOVA — Assistente Inteligente</title>
  <style>
    :root{color-scheme:dark;--bg:#09090c;--panel:#151519;--panel2:#1d1d23;--line:#303038;--text:#f7f7fa;--muted:#aaaab5;--accent:#6d8cff;--green:#55d68b}
    *{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .app{height:100vh;display:grid;grid-template-rows:64px minmax(0,1fr) 82px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(21,21,25,.96)}
    .brand{display:flex;align-items:center;gap:10px}.brand strong{font-size:18px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.status{color:var(--muted);font-size:13px;margin-left:4px}
    button,input{font:inherit}button{cursor:pointer}.icon{border:0;background:transparent;color:var(--text);font-size:21px;padding:8px}
    .chat{overflow-y:auto;padding:24px 24px 40px}.inner{max-width:820px;margin:auto}.message{max-width:78%;margin:12px 0;padding:13px 16px;line-height:1.5;border-radius:16px;white-space:pre-wrap}.assistant{background:var(--panel);border-bottom-left-radius:5px}.user{margin-left:auto;background:var(--accent);border-bottom-right-radius:5px}
    .composer{border-top:1px solid var(--line);background:var(--panel);padding:14px}.form{max-width:820px;margin:auto;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:9px}.mic{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:white;font-size:20px}.text{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:12px 14px;outline:none}.send{border:0;border-radius:12px;background:var(--accent);color:white;padding:0 18px;font-weight:700}
    dialog{width:min(520px,calc(100% - 30px));border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:22px}dialog form{display:grid;gap:14px}dialog h2{margin:0 0 4px}dialog label{display:grid;gap:7px}dialog input[type=url]{border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:11px}dialog .row{display:grid;grid-template-columns:auto 1fr;align-items:center}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{border:0;border-radius:9px;padding:10px 15px}.save{background:var(--accent);color:white}.cancel{background:var(--panel2);color:var(--text)}
    @media(max-width:600px){.app{grid-template-rows:60px minmax(0,1fr) 76px}.status{display:none}.chat{padding:16px}.message{max-width:88%}.composer{padding:10px}.send{padding:0 12px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="dot"></span><strong>NOVA</strong><span class="status">Assistente pronta</span></div>
      <button class="icon" id="settingsButton" aria-label="Configurações">⚙</button>
    </header>
    <section class="chat" id="chat" aria-live="polite"><div class="inner"><article class="message assistant">Olá. Posso abrir o Spotify, abrir sua página inicial, ler um arquivo local ou ativar o microfone. Sempre pedir sua confirmação antes de ações sensíveis.</article></div></section>
    <footer class="composer">
      <form class="form" id="commandForm">
        <button class="mic" id="voiceButton" type="button" aria-label="Falar">🎤</button>
        <input class="text" id="commandInput" autocomplete="off" placeholder="Digite um comando...">
        <button class="send" type="submit">Enviar</button>
      </form>
    </footer>
  </main>

  <dialog id="settingsDialog">
    <form id="settingsForm" method="dialog">
      <h2>Configurações</h2>
      <label>Página inicial<input id="homeUrl" type="url" placeholder="https://example.com"></label>
      <label>Spotify<input id="spotifyUrl" type="url" value="https://open.spotify.com"></label>
      <label class="row"><input id="voiceEnabled" type="checkbox" checked><span>Habilitar reconhecimento de voz</span></label>
      <div class="actions"><button class="cancel" value="cancel">Cancelar</button><button class="save" value="save">Salvar</button></div>
    </form>
  </dialog>

  <script>
  (()=>{'use strict';
    const $=id=>document.getElementById(id),chat=$('chat'),inner=chat.querySelector('.inner'),input=$('commandInput');
    let stored={};try{stored=JSON.parse(localStorage.getItem('nova-settings')||'{}')}catch{}
    const settings={homeUrl:'',spotifyUrl:'https://open.spotify.com',voiceEnabled:true,...stored};
    $('homeUrl').value=settings.homeUrl;$('spotifyUrl').value=settings.spotifyUrl;$('voiceEnabled').checked=settings.voiceEnabled;

    function add(text,type='assistant'){const el=document.createElement('article');el.className='message '+type;el.textContent=text;inner.appendChild(el);chat.scrollTop=chat.scrollHeight}
    function openPage(url,label){if(!url){add('Configure o endereço nas configurações.');return}if(!confirm('Permitir que a NOVA abra '+label+'?')){add('Ação cancelada.');return}const win=window.open(url,'_blank','noopener,noreferrer');add(win?'Abrindo '+label+'.':'O navegador bloqueou a nova aba. Permita pop-ups.');}
    function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';speechSynthesis.speak(u)}}

    async function readFile(){if(!confirm('Permitir selecionar um arquivo local para leitura?')){add('Seleção cancelada.');return}const picker=document.createElement('input');picker.type='file';picker.onchange=async()=>{const file=picker.files?.[0];if(!file)return;if(file.size>2_000_000){add('Arquivo maior que 2 MB. Escolha um arquivo menor.');return}try{const text=await file.text();add('Arquivo recebido: '+file.name);add(text.slice(0,1500)||'(Arquivo vazio)')}catch{add('Não foi possível ler este arquivo.')}};picker.click()}

    function listen(){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){add('Reconhecimento de voz não suportado neste navegador.');return}if(!settings.voiceEnabled){add('Reconhecimento de voz desativado nas configurações.');return}if(!confirm('Permitir o uso do microfone para reconhecer comandos?')){add('Uso do microfone cancelado.');return}const rec=new Recognition();rec.lang='pt-BR';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>add('Ouvindo...');rec.onerror=()=>add('Não consegui reconhecer sua voz.');rec.onresult=e=>{const text=e.results[0][0].transcript;add(text,'user');process(text)};try{rec.start()}catch{add('O reconhecimento de voz já está ativo.')}}

    function process(raw){const c=raw.toLowerCase().trim();if(c.includes('spotify')){openPage(settings.spotifyUrl,'o Spotify');return}if(c.includes('tela inicial')||c.includes('página inicial')){openPage(settings.homeUrl,'a página inicial');return}if(c.includes('arquivo')||c.includes('ler')||c.includes('selecionar')){readFile();return}if(c.includes('ajuda')||c.includes('comandos')){const t='Posso abrir o Spotify, abrir a tela inicial ou ler um arquivo selecionado por você.';add(t);speak(t);return}const t='Comando recebido: '+raw+'. Tente dizer abrir Spotify, abrir tela inicial ou ler arquivo.';add(t);speak(t)}

    $('commandForm').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';process(text)});
    $('voiceButton').addEventListener('click',listen);$('settingsButton').addEventListener('click',()=>{$('settingsDialog').showModal()});
    $('settingsForm').addEventListener('submit',e=>{if(e.submitter?.value==='save'){settings.homeUrl=$('homeUrl').value.trim();settings.spotifyUrl=$('spotifyUrl').value.trim()||'https://open.spotify.com';settings.voiceEnabled=$('voiceEnabled').checked;localStorage.setItem('nova-settings',JSON.stringify(settings));add('Configurações salvas.')}});
  })();
  </script>
</body>
</html>
