<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Football Evolution X</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101722;--line:#263449;--text:#ecf3fc;--muted:#91a1b6;--blue:#35a7ff;--red:#ff5969}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1,h2{margin:0}h1{font-size:19px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em}main{max-width:1500px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.stage{padding:10px}canvas{width:100%;display:block;aspect-ratio:12/7;border-radius:8px;background:#17653d}.scoreline{display:flex;justify-content:center;gap:16px;font-size:22px;font-weight:800;margin:4px 0 10px}.blue{color:var(--blue)}.red{color:var(--red)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}button,select{background:#202d3d;color:var(--text);border:1px solid #35475d;border-radius:7px;padding:8px 10px;font:inherit;cursor:pointer}.primary{background:#176bb3;border-color:#2789d8}.sidebar{display:flex;flex-direction:column;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#0d141e;border-radius:8px;padding:8px}.stat b{display:block;font-size:18px}.stat span,.meta{color:var(--muted);font-size:11px}.agent{border-top:1px solid var(--line);padding:8px 0}.agent:first-child{border-top:0}.agent-head{display:flex;justify-content:space-between;font-weight:bold}.history{max-height:150px;overflow:auto}.history div{border-bottom:1px solid #202b39;padding:5px 0;color:var(--muted);font-size:12px}.bar{height:5px;background:#263449;border-radius:4px;margin-top:5px}.bar i{height:100%;display:block;border-radius:4px}.subtitle,.status{color:var(--muted);font-size:12px}.status{margin-left:auto}@media(max-width:900px){main{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:600px){.sidebar{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>⚽ AI FOOTBALL EVOLUTION X</h1><div class="subtitle">Aprendizado por reforço • genética • população competitiva</div></div><div id="saveState" class="subtitle">Memória local</div></header>
<main>
<section class="panel stage"><div class="scoreline"><span class="blue">AZUL <span id="blueScore">0</span></span><span class="subtitle">—</span><span class="red"><span id="redScore">0</span> VERMELHO</span></div><canvas id="field" width="960" height="560"></canvas><div class="controls"><button id="startBtn" class="primary">Iniciar</button><button id="pauseBtn">Pausar</button><button id="restartBtn">Reiniciar</button><label class="subtitle">Velocidade <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="20">20×</option><option value="50">50×</option></select></label><button id="trainingBtn">Treinamento: desligado</button><span id="matchStatus" class="status">Pronto</span></div></section>
<aside class="sidebar"><section class="panel"><h2>Evolução por agente</h2><div id="agents"></div></section><section class="panel"><h2>Temporada</h2><div class="grid" id="stats"></div></section><section class="panel"><h2>Aprendizados da população</h2><div id="insights" class="meta"></div></section><section class="panel"><h2>Histórico</h2><div class="history" id="history"></div></section></aside>
</main>
<script>
(()=>{"use strict";
const W=960,H=560,MATCH_LENGTH=90,KEY="ai-football-evolution-x-v1",canvas=document.getElementById("field"),ctx=canvas.getContext("2d"),$=id=>document.getElementById(id);
const ACTIONS=["atacar","apoiar","pressionar","cobrir","chutar","passar","driblar","girar"];
const saved=load(),fresh={matches:0,wins:{blue:0,red:0},draws:0,goals:{blue:0,red:0},passes:0,shots:0,interceptions:0,generation:1};let season=saved.season||fresh,agents=saved.agents||makePopulation(),history=saved.history||[];
let players=[],ball,score={blue:0,red:0},matchTime=0,running=false,training=false,speed=1,lastFrame=0,lastDecision=0,saveTimer,lastTouch=null,events={passes:0,shots:0,interceptions:0};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return{}}}
function makePopulation(){const a=[];for(let i=0;i<8;i++){const team=i<4?"blue":"red";a.push({name:(team==="blue"?"BLUE":"RED")+"-"+(i%4+1),team,role:i%4<2?"atacante":"defensor",xp:0,level:1,q:{},decisions:0,rewards:0,wins:0,goals:0,passes:0,interceptions:0,fitness:50,tendencies:{pass:0,shoot:0,dribble:0,press:0},genes:{speed:137+Math.random()*18,vision:.55+Math.random()*.35,risk:.35+Math.random()*.55,teamwork:.45+Math.random()*.45}})}return a}
function save(){try{localStorage.setItem(KEY,JSON.stringify({agents,season,history}));$("saveState").textContent="Memória salva • localStorage"}catch{$("saveState").textContent="Falha ao salvar"}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,300)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function dir(p){return p.team==="blue"?1:-1}function team(t){return players.filter(p=>p.team===t)}function rivals(t){return players.filter(p=>p.team!==t)}
function resetMatch(go=true){matchTime=0;score={blue:0,red:0};lastTouch=null;events={passes:0,shots:0,interceptions:0};players=agents.map((a,i)=>{const blue=a.team==="blue",atk=a.role==="atacante",slot=i%4;return{x:blue?(atk?250:350):(atk?710:610),y:[145,270,415,415][slot],team:a.team,role:a.role,agent:a,vx:0,vy:0,tx:0,ty:0,action:"apoiar",cooldown:0}});ball={x:480,y:280,vx:0,vy:0,owner:null};running=go;updatePanels();draw()}
function state(p){const sign=dir(p),progress=p.x/W*sign+(sign<0?1:0),zone=progress<.34?"defesa":progress<.68?"meio":"ataque",poss=!ball.owner?"solta":ball.owner.team===p.team?"nossa":"rival",op=Math.min(...rivals(p.team).map(o=>dist(p,o))),mate=Math.min(...team(p.team).filter(m=>m!==p).map(m=>dist(p,m)),999);return`${p.role}|${zone}|${poss}|${op<75?"pressao":"livre"}|${mate<110?"apoio":"isolado"}`}
function q(p,s,a){return p.agent.q[s]?.[a]||0}
function choose(p,s){const a=p.agent,explore=Math.max(.04,.24-a.decisions/22000);a.decisions++;if(Math.random()<explore)return ACTIONS[Math.floor(Math.random()*ACTIONS.length)];let best=ACTIONS[0],bestV=-Infinity;for(const x of ACTIONS){let v=q(p,s,x);if(p.role==="atacante"&&x==="atacar")v+=.15;if(p.role==="defensor"&&(x==="pressionar"||x==="cobrir"))v+=.12;if(a.genes.teamwork>.65&&(x==="passar"||x==="apoiar"))v+=.12;if(a.genes.risk>.6&&(x==="chutar"||x==="driblar"))v+=.10;if(v>bestV){bestV=v;best=x}}return best}
function learn(p,s,a,r,next){const ag=p.agent;ag.q[s]||={};const old=ag.q[s][a]||0,nextV=next?Math.max(...ACTIONS.map(x=>q(p,next,x))):0;ag.q[s][a]=old+.16*(r+.78*nextV-old);ag.rewards+=r;if(r>0)ag.xp+=r*4;ag.level=1+Math.floor(ag.xp/100);scheduleSave()}
function decide(p){const s=state(p),action=choose(p,s),sign=dir(p),own=ball.owner===p,mate=team(p.team).filter(m=>m!==p).sort((a,b)=>dist(p,a)-dist(p,b))[0];p.action=action;let tx=p.x,ty=p.y;if(own){if(action==="chutar"&&shootRange(p)){shoot(p);learn(p,s,action,1.5);return}else if(action==="passar"&&mate){passBall(p,mate);learn(p,s,action,.8);return}else if(action==="driblar"||action==="atacar"){tx=p.x+sign*140;ty=p.y+(280-p.y)*.28}else if(action==="apoiar"&&mate){tx=mate.x-sign*70;ty=clamp(mate.y+(p.y<mate.y?-100:100),55,505)}else if(action==="girar"){tx=p.x-sign*45;ty=clamp(p.y+(280-p.y)*.5,55,505)}else{tx=p.x+sign*50;ty=clamp(p.y+(Math.random()-.5)*100,55,505)}}else if(ball.owner&&ball.owner.team===p.team){tx=ball.owner.x-sign*(p.role==="atacante"?65:115);ty=clamp(ball.owner.y+(p.y<ball.owner.y?-105:105),55,505);if(action==="cobrir")tx=clamp(ball.owner.x-sign*160,70,890);if(action==="pressionar")tx=ball.owner.x-sign*35}else{if(action==="cobrir"&&p.role==="defensor"){tx=clamp(480-sign*220,70,890);ty=280+(p.y-280)*.45}else if(action==="apoiar"){tx=clamp(ball.x-sign*75,55,905);ty=clamp(ball.y+(p.y<ball.y?-95:95),55,505)}else{tx=ball.owner?ball.owner.x:ball.x;ty=ball.owner?ball.owner.y:ball.y;if(action==="pressionar")ty+=sign*(p.y<280?35:-35)}}p.tx=clamp(tx,25,935);p.ty=clamp(ty,35,525)}
function shootRange(p){return(p.team==="blue"?960-p.x:p.x)<300&&Math.abs(p.y-280)<190}
function shoot(p){kick(p,p.team==="blue"?960:0,280+(Math.random()-.5)*105,620);events.shots++;season.shots++;p.agent.tendencies.shoot++}
function passBall(p,mate){kick(p,mate.x+mate.vx*.14,mate.y+mate.vy*.14,430);events.passes++;season.passes++;p.agent.passes++;p.agent.tendencies.pass++}
function kick(p,x,y,power){const d=Math.hypot(x-p.x,y-p.y)||1;ball.owner=null;ball.vx=(x-p.x)/d*power;ball.vy=(y-p.y)/d*power;lastTouch=p;p.cooldown=.38}
function acquire(p){const old=ball.owner;ball.owner=p;ball.vx=ball.vy=0;if(old&&old.team!==p.team){events.interceptions++;season.interceptions++;p.agent.interceptions++;p.agent.tendencies.press++;learn(p,state(p),p.action||"pressionar",2.5)}}
function update(dt){matchTime+=dt;lastDecision+=dt;if(lastDecision>=.22){lastDecision=0;for(const p of players)decide(p)}for(const p of players){p.cooldown=Math.max(0,p.cooldown-dt);const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1,max=p.agent.genes.speed+(p.role==="atacante"?8:0);p.vx+=(dx/d*max-p.vx)*Math.min(1,dt*5);p.vy+=(dy/d*max-p.vy)*Math.min(1,dt*5);p.x=clamp(p.x+p.vx*dt,18,942);p.y=clamp(p.y+p.vy*dt,28,532)}separate();if(ball.owner){ball.x=ball.owner.x+dir(ball.owner)*15;ball.y=ball.owner.y;if(ball.x<5||ball.x>955)goal(ball.owner.team)}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const drag=Math.pow(.986,dt*60);ball.vx*=drag;ball.vy*=drag;if(ball.y<18||ball.y>542){ball.y=clamp(ball.y,18,542);ball.vy*=-.72}if((ball.x<5||ball.x>955)&&Math.abs(ball.y-280)<62)goal(lastTouch?.team||(ball.x<5?"red":"blue"));else if(ball.x<8||ball.x>952){ball.x=clamp(ball.x,8,952);ball.vx*=-.65}for(const p of players)if(p.cooldown<=0&&dist(p,ball)<21){acquire(p);break}}if(matchTime>=MATCH_LENGTH)finish()}
function separate(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d<29){const o=(29-d)/2,nx=dx/d,ny=dy/d;a.x=clamp(a.x-nx*o,18,942);a.y=clamp(a.y-ny*o,28,532);b.x=clamp(b.x+nx*o,18,942);b.y=clamp(b.y+ny*o,28,532)}}}
function goal(teamName){score[teamName]++;season.goals[teamName]++;if(lastTouch){lastTouch.agent.goals++;lastTouch.agent.xp+=20;learn(lastTouch,state(lastTouch),lastTouch.action,8)}ball.owner=null;ball.x=480;ball.y=280;ball.vx=ball.vy=0;lastTouch=null;for(const p of players){p.x=p.team==="blue"?(p.role==="atacante"?250:350):(p.role==="atacante"?710:610);p.y=p.role==="atacante"?210:350;p.vx=p.vy=0}}
function finish(){running=false;season.matches++;let result;if(score.blue>score.red){result="Vitória azul";season.wins.blue++}else if(score.red>score.blue){result="Vitória vermelha";season.wins.red++}else{result="Empate";season.draws++}for(const a of agents){const won=(score.blue>score.red&&a.team==="blue")||(score.red>score.blue&&a.team==="red"),drawn=score.blue===score.red;a.xp+=won?100:drawn?25:10;if(won)a.wins++;a.fitness=clamp(a.fitness+(won?8:-3)+(a.goals*2)+(a.passes*.1),0,100)}if(season.matches%25===0)evolve();history.unshift(`${result}: Azul ${score.blue}–${score.red} Vermelho • G${season.generation}`);history=history.slice(0,40);$("matchStatus").textContent=`${result} • partida ${season.matches}`;updatePanels();save();if(training)setTimeout(()=>{if(training)resetMatch(true)},30)}
function evolve(){season.generation++;for(const teamName of ["blue","red"]){const pop=agents.filter(a=>a.team===teamName).sort((a,b)=>b.fitness-a.fitness),elite=pop[0];for(let i=1;i<pop.length;i++){const child=pop[i];child.genes={speed:clamp(elite.genes.speed+(Math.random()-.5)*20,120,170),vision:clamp(elite.genes.vision+(Math.random()-.5)*.2,.25,1),risk:clamp(elite.genes.risk+(Math.random()-.5)*.3,.1,.95),teamwork:clamp(elite.genes.teamwork+(Math.random()-.5)*.3,.1,.95)};child.fitness=50}}history.unshift(`Geração ${season.generation}: seleção genética aplicada`);save()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#17653d";ctx.fillRect(0,0,W,H);for(let i=0;i<12;i++){ctx.fillStyle=i%2?"rgba(255,255,255,.025)":"rgba(0,0,0,.025)";ctx.fillRect(i*80,0,80,H)}ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=2;ctx.strokeRect(18,18,924,524);ctx.beginPath();ctx.moveTo(480,18);ctx.lineTo(480,542);ctx.stroke();ctx.beginPath();ctx.arc(480,280,75,0,Math.PI*2);ctx.stroke();ctx.strokeRect(18,135,145,290);ctx.strokeRect(797,135,145,290);ctx.fillStyle="#dce8f5";ctx.fillRect(-8,218,12,124);ctx.fillRect(956,218,12,124);for(const p of players){const c=p.team==="blue"?"#37a5ff":"#ff5969";ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle=ball.owner===p?"#fff1a8":"#fff";ctx.lineWidth=ball.owner===p?3:1;ctx.stroke();ctx.fillStyle="#08111c";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText(p.role==="atacante"?"A":"D",p.x,p.y+3);ctx.fillStyle="#fff";ctx.font="9px system-ui";ctx.fillText(p.agent.name,p.x,p.y-18)}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,Math.PI*2);ctx.fill();$("blueScore").textContent=score.blue;$("redScore").textContent=score.red}
function updatePanels(){ $("agents").innerHTML=agents.map(a=>{const states=Object.keys(a.q).length,fit=Math.round(a.fitness);return`<div class="agent"><div class="agent-head"><span class="${a.team}">${a.name}</span><span>Nível ${a.level}</span></div><div class="meta">${a.role} • fitness ${fit}% • XP ${Math.floor(a.xp)} • ${states} estados</div><div class="meta">Gols ${a.goals} • passes ${a.passes} • cortes ${a.interceptions} • decisões ${a.decisions}</div><div class="bar"><i style="width:${fit}%;background:${a.team==="blue"?"#37a5ff":"#ff5969"}"></i></div></div>`}).join("");const vals=[["Partidas",season.matches],["Geração",season.generation],["Vitórias azul",season.wins.blue],["Vitórias vermelho",season.wins.red],["Empates",season.draws],["Gols azul",season.goals.blue],["Gols vermelho",season.goals.red],["Passes",season.passes],["Chutes",season.shots],["Interceptações",season.interceptions]];$("stats").innerHTML=vals.map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");$("history").innerHTML=history.length?history.map(x=>`<div>${x}</div>`).join(""):"Nenhuma partida concluída.";const top=[...agents].sort((a,b)=>b.fitness-a.fitness).slice(0,3);$("insights").innerHTML="<b>Melhor população:</b><br>"+top.map(a=>`${a.name}: velocidade ${Math.round(a.genes.speed)}, risco ${(a.genes.risk*100).toFixed(0)}%, cooperação ${(a.genes.teamwork*100).toFixed(0)}%`).join("<br>")}
function frame(ts){if(!lastFrame)lastFrame=ts;const elapsed=Math.min(.05,(ts-lastFrame)/1000);lastFrame=ts;if(running){if(training){let remaining=elapsed*speed*90,steps=0;while(remaining>0&&steps<100&&running){const dt=Math.min(.04,remaining/12);update(dt);remaining-=dt*12;steps++}}else update(elapsed*speed)}draw();requestAnimationFrame(frame)}
$("startBtn").onclick=()=>{if(matchTime>=MATCH_LENGTH)resetMatch(true);running=true;$("matchStatus").textContent="Partida em andamento"};$("pauseBtn").onclick=()=>{running=false;$("matchStatus").textContent="Pausado"};$("restartBtn").onclick=()=>{training=false;$("trainingBtn").textContent="Treinamento: desligado";resetMatch(false);$("matchStatus").textContent="Reiniciado"};$("speed").onchange=e=>speed=Number(e.target.value)||1;$("trainingBtn").onclick=()=>{training=!training;$("trainingBtn").textContent=`Treinamento: ${training?"ligado":"desligado"}`;if(training){resetMatch(true);$("matchStatus").textContent="Treinamento automático"}else running=false};
resetMatch(false);updatePanels();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
